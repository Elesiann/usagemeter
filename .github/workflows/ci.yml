name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Helper tests
        run: npm test

      - name: Bundled helper matches its source
        run: |
          npm run build
          git diff --exit-code -- helper/dist/usagemeter-helper.mjs

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code

      - name: Validate the plugin
        run: claude plugin validate . --strict

      - name: Mod tests
        run: claude plugin test .
