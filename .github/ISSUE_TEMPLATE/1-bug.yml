name: Bug report
description: Something in the pane is wrong, missing, or broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not paste API keys, management keys, or transcript contents.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. A screenshot of the pane helps.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run /usagemeter
        2. Press 3
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: usagemeter version
      description: Shown by `claude plugin list`.
    validations:
      required: true
  - type: input
    id: claude
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, macOS, WSL, Windows, Other]
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where Claude Code runs
      options: [Terminal, Desktop app (Code tab), Other]
